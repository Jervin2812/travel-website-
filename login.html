<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Terra Luxury Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Navbar -->
  <header class="site-navbar">
    <div class="container">
      <nav class="navbar navbar-expand-lg p-0">
        <a class="brand-logo" href="index.html">
          <div class="brand-icon-circle"><i class="bi bi-compass"></i></div>
          <span>TERRA</span>
        </a>
        <div class="ms-auto">
          <span class="text-muted small me-2">Don't have an account?</span>
          <a href="signup.html" class="btn btn-outline-custom btn-sm">Sign Up</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Login Area -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h2 class="font-weight-bold">Welcome Back</h2>
        <p class="text-muted small">Sign in to access your saved trips, vouchers, and member benefits.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="form-label small fw-bold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="loginEmail" placeholder="e.g. jervin@example.com" value="jervin.raj@example.com" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label for="loginPassword" class="form-label small fw-bold">Password</label>
            <a href="#" class="small text-muted" onclick="alert('Password reset link demo sent to your email.'); return false;">Forgot?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="loginPassword" value="TravelSecret2026!" required>
            <button type="button" class="btn btn-outline-secondary password-toggle-btn" data-target="loginPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small" for="rememberMe">Remember my login</label>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3">Sign In to Terra</button>

        <div class="alert alert-info py-2 px-3 small text-center mb-0">
          <i class="bi bi-info-circle me-1"></i> Frontend demo: Any credentials will log you in locally.
        </div>
      </form>
    </div>
  </main>

  <footer class="py-3 text-center text-muted small bg-white border-top">
    &copy; 2026 Terra Travel Inc.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth-demo.js"></script>
</body>
</html>
