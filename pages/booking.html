<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Request a Booking | Wanderly</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="site-header"><nav class="navbar navbar-expand-lg"><div class="container"><a class="navbar-brand" href="../index.html"><span class="brand-mark">W</span> wanderly</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="siteNav"><ul class="navbar-nav mx-auto"><li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li><li class="nav-item"><a class="nav-link" href="packages.html">Tour Packages</a></li><li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li></ul></div></div></nav></header><main><section class="page-hero"><div class="container"><span class="eyebrow">START PLANNING</span><h1>Request your trip</h1><p>Tell us what you're dreaming of. This demo form does not submit to a server.</p></div></section><section class="section-space"><div class="container"><div class="form-panel mx-auto"><form id="bookingForm" class="row g-3"><div class="col-md-6"><label class="form-label" for="fullName">Full name</label><input class="form-control" id="fullName" name="fullName" autocomplete="name" required></div><div class="col-md-6"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div><div class="col-md-6"><label class="form-label" for="tripDestination">Destination</label><select class="form-select" id="tripDestination" name="destination" required><option value="">Choose destination</option><option>Swiss Alps</option><option>Santorini, Greece</option><option>Kyoto, Japan</option><option>Thailand</option><option>Italian Coast</option><option>Other</option></select></div><div class="col-md-6"><label class="form-label" for="guestCount">Travelers</label><select class="form-select" id="guestCount" name="travelers"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5+</option></select></div><div class="col-md-6"><label class="form-label" for="departureDate">Departure date</label><input class="form-control" type="date" id="departureDate" name="departureDate" required></div><div class="col-md-6"><label class="form-label" for="returnDate">Return date</label><input class="form-control" type="date" id="returnDate" name="returnDate" required></div><div class="col-12"><label class="form-label" for="notes">Anything else we should know? (optional)</label><textarea class="form-control" id="notes" name="notes" rows="4" placeholder="Interests, preferences, special requests..."></textarea></div><div class="col-12"><button class="btn btn-primary rounded-pill px-4 py-3" type="submit">Send booking request</button></div><div class="col-12"><p id="bookingMessage" class="small mb-0" aria-live="polite"></p></div></form></div></div></section></main><footer class="site-footer"><div class="container py-4 d-flex justify-content-between flex-wrap gap-2"><a class="navbar-brand" href="../index.html"><span class="brand-mark">W</span> wanderly</a><span>© <span id="currentYear"></span> Wanderly</span></div></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../js/main.js"></script><script src="../js/booking.js"></script></body></html>
