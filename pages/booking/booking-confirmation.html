<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 3: Booking Confirmed | Terra Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body class="bg-light">

  <!-- Simple Header -->
  <header class="bg-white border-bottom py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand-logo" href="../../index.html">
        <div class="brand-icon-circle"><i class="bi bi-compass"></i></div>
        <span>TERRA</span>
      </a>
      <a href="../../index.html" class="btn btn-outline-custom btn-sm"><i class="bi bi-house me-1"></i> Return Home</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="py-5">
    <div class="container" style="max-width: 900px;">
      <!-- Step Indicator -->
      <div class="step-indicator-bar mb-4">
        <div class="step-item completed">
          <div class="step-circle"><i class="bi bi-check-lg"></i></div>
          <span>Traveler Details</span>
        </div>
        <div class="step-line" style="width: 40px; height: 2px; background: #10b981;"></div>
        <div class="step-item completed">
          <div class="step-circle"><i class="bi bi-check-lg"></i></div>
          <span>Payment & Review</span>
        </div>
        <div class="step-line" style="width: 40px; height: 2px; background: #10b981;"></div>
        <div class="step-item active">
          <div class="step-circle"><i class="bi bi-check-lg"></i></div>
          <span>Confirmed</span>
        </div>
      </div>

      <!-- Confirmation Display Box (Populated by booking.js) -->
      <div id="confirmationDisplayBox"></div>

      <!-- Actions -->
      <div class="d-flex flex-wrap justify-content-center gap-3">
        <button class="btn btn-navy-custom py-3 px-4" onclick="window.print()">
          <i class="bi bi-printer me-2"></i> Print Travel Voucher
        </button>
        <a href="my-bookings.html" class="btn btn-primary-custom py-3 px-4">
          <i class="bi bi-briefcase me-2"></i> View in My Bookings
        </a>
        <a href="../destinations/destinations.html" class="btn btn-outline-custom py-3 px-4">
          Explore More Trips
        </a>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-muted small">
    &copy; 2026 Terra Travel Inc. Simulated frontend demo. No real transactions.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/booking.js"></script>
</body>
</html>
